<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leo Zihelmanis - Portfolio</title>
    <link rel="stylesheet" href="styles/style.css" />
    <script src="scripts/include.js" defer></script>
  </head>
  <body>

    <div data-include="sections/nav.html"></div>

    <div data-include="sections/hero.html"></div>

    <main>
      <div data-include="sections/projects.html"></div>
      <div data-include="sections/skills.html"></div>
      <div data-include="sections/contact.html"></div>
    </main>

    <script>
      document.addEventListener('includesLoaded', () => {
        const imageNames = [
          "Screenshot 2026-05-12 204336.png",
          "Screenshot 2026-05-12 204413.png",
          "Screenshot 2026-05-14 205501.png",
          "Screenshot 2026-05-29 204414.png",
          "Screenshot 2026-05-29 204424.png",
          "Screenshot 2026-05-29 204442.png",
          "Screenshot 2026-05-29 204457.png",
          "Screenshot 2026-06-04 195912.png",
          "Screenshot 2026-06-04 195944.png",
          "Screenshot 2026-06-04 195957.png",
          "Screenshot 2026-06-04 203331.png",
          "Screenshot 2026-06-04 203615.png",
        ];

        const carouselContainer = document.getElementById('dynamic-carousel');
        const counterElement = document.getElementById('carousel-counter');
        if (carouselContainer && counterElement) {
          imageNames.forEach((name, index) => {
            const img = document.createElement('img');
            img.src = `images/${name}`;
            img.alt = `Warehouse Planner Screenshot ${index + 1}`;
            if (index === 0) img.classList.add('active');
            carouselContainer.appendChild(img);
          });

          let currentSlideIndex = 0;

          function updateCounter() {
            counterElement.textContent = `${currentSlideIndex + 1} / ${imageNames.length}`;
          }

          window.moveSlide = function (direction) {
            const slides = document.querySelectorAll('.carousel-slide img');
            if (slides.length === 0) return;

            slides[currentSlideIndex].classList.remove('active');
            currentSlideIndex += direction;

            if (currentSlideIndex >= slides.length) {
              currentSlideIndex = 0;
            } else if (currentSlideIndex < 0) {
              currentSlideIndex = slides.length - 1;
            }

            slides[currentSlideIndex].classList.add('active');
            updateCounter();
          };

          updateCounter();
        }
      });
    </script>
  </body>
</html>
